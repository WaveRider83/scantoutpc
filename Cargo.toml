[package]
name = "scantoutpc"
version = "0.2.5"
edition = "2024"

[dependencies]
rxing = { version = "0.9", default-features = false, features = ["decoders", "multi_barcode_readers", "qrcode", "datamatrix", "oned", "pdf417", "aztec", "encoding_rs"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
arboard = "3.7.0"
eframe = "0.37.0"
global-hotkey = "0.10.0"
image = "0.25.10"
oar-ocr = { version = "0.11.0", default-features = false, features = ["simd"] }
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["load-dynamic", "std", "api-17"] }
tray-icon = "0.26.1"
xcap = { version = "0.9.10", features = ["wgc"] }
windows-sys = { version = "0.61", features = ["Win32_Graphics_Gdi", "Win32_Foundation"] }
ureq = "2"

[features]
debuglog = []

[build-dependencies]
embed-resource = "2"
