<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ScantoutPC</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <main class="panel">
      <header class="bar" data-tauri-drag-region>
        <span class="dot"></span>
        <span class="title">ScantoutPC</span>
      </header>
      <textarea id="ocr-text" spellcheck="false" placeholder="Le texte capturé apparaîtra ici…"></textarea>
      <footer class="actions">
        <button id="btn-copy" type="button">Copier</button>
        <button id="btn-translate" type="button">Traduire</button>
        <span id="status" class="status">capture inactive</span>
      </footer>
    </main>
  </body>
</html>
